# Pushing a tag like v2.0 makes a release with the installer: Setup.exe with this repository
# and its third-party submodules appended as a zip (setup/setup.c reads it back). No game
# code is in it: each game is built from the player's own ROM when Setup runs.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  setup:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: LLVM-MinGW (the same pinned build the installer uses)
        run: |
          curl -L --fail -o llvm-mingw.zip https://github.com/mstorsjo/llvm-mingw/releases/download/20260616/llvm-mingw-20260616-ucrt-x86_64.zip
          echo "b9b68a4d276e16fa25802aaba458e4638f64b3884c290aaccdc2d87083b6ca35  llvm-mingw.zip" | sha256sum -c
          7z x -y -o"$RUNNER_TEMP" llvm-mingw.zip > /dev/null
          echo "$RUNNER_TEMP/llvm-mingw-20260616-ucrt-x86_64/bin" >> "$GITHUB_PATH"

      - name: Build Setup.exe
        run: |
          cmake -S . -B build/sor1 -G Ninja -DGAME=sor1 -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          cmake --build build/sor1 --target Setup

      - name: Append the source
        run: |
          name="Streets-of-Rage-Collection-Setup-${GITHUB_REF_NAME}.exe"
          # Staged at the drive's root: the submodules' deepest paths, under the runner's own
          # work folder, pass Windows' 260-character limit. Setup drops the zip's top folder.
          stage=/c/sorstage
          mkdir -p "$stage/src"
          # Regular files only: the submodules' symlinks (in examples the build never uses)
          # are links on this runner, some to nothing, and do not unpack on Windows anyway.
          git ls-files -z --recurse-submodules | while IFS= read -r -d '' f; do
            if [ -L "$f" ] || [ ! -f "$f" ]; then continue; fi
            mkdir -p "$stage/src/$(dirname "$f")"
            cp "$f" "$stage/src/$f" || { echo "could not copy $f"; exit 1; }
          done
          # Dated a day back: zips keep times without a time zone, and a file dated after the
          # player's clock makes ninja rebuild its build file forever (Setup also ignores these
          # times when it unpacks).
          find "$stage/src" -exec touch -d "$(date -u -d '1 day ago' '+%Y-%m-%d %H:%M:%S')" {} +
          (cd "$stage" && 7z a -tzip -mx=9 source.zip src > /dev/null)
          cp "$stage/source.zip" source.zip
          cp build/sor1/Setup.exe "$name"
          cat source.zip >> "$name"
          python -c "import struct,os; f=open('$name','ab'); f.write(struct.pack('<Q', os.path.getsize('source.zip'))); f.write(b'SORPAYLD')"
          echo "SETUP=$name" >> "$GITHUB_ENV"

      # What changed (docs/release-<tag>.md, when there is one), then how to install.
      - name: Release notes
        run: |
          { if [ -f "docs/release-${GITHUB_REF_NAME}.md" ]; then cat "docs/release-${GITHUB_REF_NAME}.md"; echo; echo "---"; echo; fi
            cat <<'NOTES'
          **Download `${{ env.SETUP }}`** below and run it.

          Setup asks where to install (your user's Programs folder by default, no administrator rights needed), then for your own ROMs: Streets of Rage (World), Streets of Rage 2 (USA) and Streets of Rage 3 (USA), with optional rows under it for Bare Knuckle III (Japan), its English patch and the Bare Knuckle III DX patch (Bare Knuckle III is built on the USA ROM, so pick that one too). Each is checked as you pick it; skip any you do not have and add it later by running Setup again (Settings > Apps > Streets of Rage Collection > Modify).

          It then downloads the build tools it needs (Node.js, CMake, Ninja and LLVM-MinGW, about 260 MB, from their publishers, checked against pinned SHA-256s) into the install folder, builds each game from its ROM (a few minutes), and adds the collection to the Start menu.

          No part of any game is included in this release. You need your own copies of the cartridges.
          NOTES
          } > release-notes.md

      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.SETUP }}
          body_path: release-notes.md
